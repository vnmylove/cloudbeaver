teleport.label = Teleport JWT
teleport.description = Authenticates users from a Teleport application access JWT

user = User name
user.description = User name taken from the verified Teleport JWT
fullName = Display name
fullName.description = Display name taken from the verified Teleport JWT
teams = Teleport roles
teams.description = Teleport roles from the verified JWT, mapped to CloudBeaver teams

jwks-url = JWKS URL
jwks-url.description = Teleport JWKS endpoint, for example https://teleport.example.com/.well-known/jwks.json
issuer = Issuer
issuer.description = Expected iss claim, usually the Teleport cluster name
audience = Audience
audience.description = Expected aud claim. Copy it exactly from a real Teleport JWT; a missing or extra scheme makes every login fail
header-name = JWT header name
header-name.description = Request header carrying the Teleport JWT
username-claim = User name claim
username-claim.description = JWT claim used as the CloudBeaver user id. Falls back to sub when empty
display-name-claim = Display name claim
display-name-claim.description = JWT claim used as the CloudBeaver display name
teams-claim = Teams claim
teams-claim.description = JWT claim whose values are matched against the teleport.role-name metadata of CloudBeaver teams. Teleport publishes this as roles
team-filter-prefix = Team filter prefix
team-filter-prefix.description = When set, only claim values starting with this prefix are mapped to teams
team-strip-prefix = Team strip prefix
team-strip-prefix.description = Prefix removed from a claim value before it is matched to a team
auth-role-claim = Auth role claim
auth-role-claim.description = Optional JWT claim that sets the CloudBeaver auth role, such as admin or user. This is not a team membership
auto-user-provisioning = Auto user provisioning
auto-user-provisioning.description = Reserved. CloudBeaver creates the user on first login
clock-skew-seconds = Clock skew (seconds)
clock-skew-seconds.description = Allowed difference between the token time and the server time
jwks-cache-ttl-seconds = JWKS cache TTL (seconds)
jwks-cache-ttl-seconds.description = How long fetched signing keys are reused. A key id that is not cached triggers one refresh
logout-url = Logout URL
logout-url.description = URL opened when the user signs out, for example https://teleport.example.com/web/logout

teleport.role-name = Teleport role name
teleport.role-name.description = Teleport role name that grants membership in this CloudBeaver team
